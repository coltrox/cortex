<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem zoom.
         `maximum-scale` e `user-scalable=no` matam a pinça e o toque duplo.
         Num app de lista e botão o zoom só acontece por acidente — a pinça que
         devia rolar a tela, o toque duplo que devia marcar — e deixa a pessoa
         com a tela torta sem saber como desfazer.

         SEM `interactive-widget=resizes-content`. Ele esteve aqui e fazia a
         tela encolher quando o teclado abria: a barra de abas, fixa no fundo
         da tela, subia junto e ficava por cima do teclado. Sem ele o teclado
         cobre a tela, e a barra fica embaixo, escondida atrás dele. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- A cor da barra de status é a do TOPO DA PÁGINA, `--fundo`. Chegaram a
         existir três escuros diferentes — o manifesto, esta meta e a página —,
         e a emenda entre eles aparecia como uma linha no topo do app. -->
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)" />
    <!-- O tema entra ANTES da primeira pintura.

         Ele era aplicado por `main.tsx`, que é módulo e roda depois de o
         navegador já ter pintado o primeiro quadro — no tema claro, porque
         sem `data-tema` valem as cores claras. O Android guardava a cor
         daquele quadro nas barras do sistema, e a linha branca no topo ficava
         até a página ser recarregada.

         Script comum no `<head>` bloqueia a pintura até rodar: é por isso
         que ele é minúsculo. A chave e os valores são os de `src/tema.ts`. -->
    <script>
      (function () {
        var t = 'sistema'
        try { t = localStorage.getItem('cortex.tema') || 'sistema' } catch (e) {}
        if (t !== 'claro' && t !== 'escuro') t = 'sistema'
        document.documentElement.setAttribute('data-tema', t)
        var escuro = t === 'escuro' || (t === 'sistema' && !!window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
        var m = document.createElement('meta')
        m.name = 'theme-color'
        m.content = escuro ? '#101215' : '#faf9f6'
        document.head.appendChild(m)
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- As duas fontes do desenho. `preconnect` porque elas vêm de outro
         domínio e o aperto de mão de TLS custa mais que o arquivo;
         `display=swap` porque texto invisível esperando fonte é pior que
         texto na fonte errada por 200 ms. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- O iOS ignora os ícones do manifest e usa só este. Tem que ser 180x180
         e OPACO: transparência ali é composta sobre preto, e a arte escura
         sumiria contra ele. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <title>Cortex</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registrado só fora do desenvolvimento: em localhost o service worker
      // serve versão velha do módulo e faz perder meia hora.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js'))
      }
    </script>
  </body>
</html>
