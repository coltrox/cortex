<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Acompanha o casco do app nos dois temas: é a cor que o Android pinta
         na barra de status, e ela destoando do topo da tela é a coisa mais
         visível que um app instalado pode ter de errado. -->
    <meta name="theme-color" content="#efede8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- As duas fontes do desenho. `preconnect` porque elas vêm de outro
         domínio e o aperto de mão de TLS custa mais que o arquivo;
         `display=swap` porque texto invisível esperando fonte é pior que
         texto na fonte errada por 200 ms. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- O iOS ignora os ícones do manifest e usa só este. Tem que ser 180x180
         e OPACO: transparência ali é composta sobre preto, e a arte escura
         sumiria contra ele. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <title>Cortex</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registrado só fora do desenvolvimento: em localhost o service worker
      // serve versão velha do módulo e faz perder meia hora.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js'))
      }
    </script>
  </body>
</html>
