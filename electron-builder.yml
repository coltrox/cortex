appId: dev.pedrocosta.cortex
productName: Cortex
# O nome que o Windows mostra em Propriedades › Detalhes e no instalador.
# Sem isto o campo fica com o valor do `package.json` ou vazio, e o app
# aparece como de origem desconhecida mesmo antes do aviso do SmartScreen.
copyright: Pedro Coltro

directories:
  buildResources: build
  output: dist

# Exclusões sobre o padrão do electron-builder — ele já sabe incluir `out/` e
# as dependências de produção, e já deixa as devDependencies de fora. Listar
# `files` de forma positiva substituiria esse padrão, e é assim que se esquece
# de empacotar um `node_modules` inteiro.
files:
  - '!src/*'
  - '!scripts/*'
  - '!docs/*'
  - '!previa/*'
  - '!**/*.test.*'
  - '!electron.vite.config.*'
  - '!vitest.config.*'
  - '!tsconfig*.json'
  - '!**/.vscode/*'
  - '!**/*.map'

# O better-sqlite3 é um módulo nativo: o `.node` precisa ficar FORA do asar,
# senão o processo não consegue carregá-lo em tempo de execução.
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'

# Não recompilar dependências nativas.
#
# O better-sqlite3 13 distribui binários N-API em `prebuilds/<plataforma>.node`
# (padrão do node-gyp-build). N-API é estável entre runtimes: o mesmo arquivo
# serve para Node e para Electron, e o app já roda com ele em desenvolvimento.
# Deixar o rebuild ligado faz o electron-builder chamar node-gyp, que exige
# Python e as Build Tools do Visual Studio — ausentes nesta máquina de
# propósito. Escolhemos esta biblioteca justamente para não precisar delas.
npmRebuild: false

# De onde o app procura versão nova.
#
# É esta seção que gera o `app-update.yml` dentro do pacote — o arquivo que o
# `electron-updater` lê para saber onde olhar. Ele já existia no build
# anterior, apontando para cá, mas a biblioteca que o usa não estava
# empacotada: a configuração estava pronta e o motor faltava.
#
# `releaseType: release` não pega rascunho nem pré-lançamento: uma release
# ainda sendo escrita não pode ser oferecida a quem está usando o app.
publish:
  provider: github
  owner: coltrox
  repo: cortex
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Instalação por usuário, em %LOCALAPPDATA% — não pede senha de
  # administrador, que é o que permite instalar num PC de escola.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cortex
  artifactName: Cortex-${version}-instalador.${ext}

  # As imagens do assistente. BMP de 24 bits, e não PNG: o NSIS não lê PNG
  # nesses dois lugares, e um arquivo com canal alfa aqui sai com o fundo
  # preto ou simplesmente não aparece.
  #
  # 164x314 é a faixa lateral das telas de boas-vindas e de conclusão;
  # 150x57 é o cabeçalho das telas do meio. Geradas do ícone de 2000x2000
  # sobre o mesmo fundo escuro da janela do app, para o instalador parecer do
  # mesmo produto que o programa que ele instala.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp

  # A tela de boas-vindas, com o texto em `build/instalador.nsh`. Sem isto o
  # assistente abre direto na escolha da pasta — que serve para quem já
  # conhece o app, e não diz nada para quem está instalando pela primeira vez.
  include: build/instalador.nsh

  # A última tela oferece abrir o app, já marcado.
  runAfterFinish: true
  # Ao desinstalar, o vault NÃO é tocado: ele vive numa pasta do usuário,
  # escolhida por ele. O desinstalador só remove o app.
  deleteAppDataOnUninstall: false
